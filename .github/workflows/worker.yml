name: worker image

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Uvolnit místo na disku
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: worker
          push: true
          tags: |
            ghcr.io/itsbobik-pixel/playalong-worker:latest
            ghcr.io/itsbobik-pixel/playalong-worker:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # cache vrstev v registru: při změně kódu se přestaví jen poslední malá vrstva (minuty místo ~20 min)
          cache-from: type=registry,ref=ghcr.io/itsbobik-pixel/playalong-worker:buildcache
          cache-to: type=registry,ref=ghcr.io/itsbobik-pixel/playalong-worker:buildcache,mode=max
